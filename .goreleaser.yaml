---
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: netrouse

builds:
  - id: cli
    binary: "{{ .ProjectName }}"
    main: ./cmd/cli
    goos:
      - linux
    goarch:
      - arm64
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s
    env:
      - CGO_ENABLED=0
  - id: gui
    binary: "{{ .ProjectName }}-gui"
    goos:
      - linux
    goarch:
      - arm64
      - amd64
    tool: fyne-wrapper.sh
    flags:
      - --release
    env:
      - CGO_ENABLED=1
      - >-
        {{- if eq .Arch "amd64"}}CC=zig cc -target x86_64-linux-gnu.2.38 -isystem /usr/include -L/usr/lib/x86_64-linux-gnu{{- end }}
        {{- if eq .Arch "arm64"}}CC=zig cc -target aarch64-linux-gnu.2.38 -isystem /usr/include -L/usr/lib/aarch64-linux-gnu{{- end }}
      - >-
        {{- if eq .Arch "amd64"}}CXX=zig c++ -target x86_64-linux-gnu.2.38 -isystem /usr/include -L/usr/lib/x86_64-linux-gnu{{- end }}
        {{- if eq .Arch "arm64"}}CXX=zig c++ -target aarch64-linux-gnu.2.38 -isystem /usr/include -L/usr/lib/aarch64-linux-gnu{{- end }}

archives:
  - id: tar
    ids:
      - gui
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}-gui_{{ tolower .Os }}-{{ .Arch }}"
    files:
      - strip_parent: true
        src: "packages/*"
nfpms:
  - id: gui
    package_name: "{{ .ProjectName }}"
    file_name_template: "{{ .PackageName }}_v{{ .Version }}_linux-{{ .Arch }}"
    ids:
      - gui
    maintainer: Heathcliff <heathcliff@heathcliff.eu>
    description: |
      This is a simple utility for sending Wake-On-Lan magic packet to clients in the local network.
      It can be used directly via the cli, or remotely via a web interface.
    license: Apache-2.0
    homepage: https://github.com/heathcliff26/{{ .ProjectName }}
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - dst: /usr/share/licenses/{{ .PackageName }}
        type: dir
      - dst: /usr/share/doc/{{ .PackageName }}
        type: dir
      - src: LICENSE
        dst: /usr/share/licenses/{{ .PackageName }}/LICENSE
      - src: README.md
        dst: /usr/share/doc/{{ .PackageName }}/README.md
      - src: packages/io.github.heathcliff26.{{ .PackageName }}.desktop
        dst: /usr/share/applications/io.github.heathcliff26.{{ .PackageName }}.desktop
      - src: packages/io.github.heathcliff26.{{ .PackageName }}.png
        dst: /usr/share/icons/hicolor/256x256/apps/io.github.heathcliff26.{{ .PackageName }}.png
      - src: packages/io.github.heathcliff26.{{ .PackageName }}.svg
        dst: /usr/share/icons/hicolor/scalable/apps/io.github.heathcliff26.{{ .PackageName }}.svg
      - src: io.github.heathcliff26.{{ .PackageName }}.metainfo.xml
        dst: /usr/share/metainfo/io.github.heathcliff26.{{ .PackageName }}.metainfo.xml
    rpm:
      summary: Wake on Lan Utility
  - id: cli
    package_name: "{{ .ProjectName }}d"
    file_name_template: "{{ .PackageName }}_v{{ .Version }}_linux-{{ .Arch }}"
    ids:
      - cli
    maintainer: Heathcliff <heathcliff@heathcliff.eu>
    description: |
      This is a simple utility for sending Wake-On-Lan magic packet to clients in the local network.
      It can be used directly via the cli, or remotely via a web interface.
    license: Apache-2.0
    homepage: https://github.com/heathcliff26/{{ .ProjectName }}
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - dst: /usr/share/licenses/{{ .PackageName }}
        type: dir
      - dst: /usr/share/doc/{{ .PackageName }}
        type: dir
      - src: LICENSE
        dst: /usr/share/licenses/{{ .PackageName }}/LICENSE
      - src: README.md
        dst: /usr/share/doc/{{ .PackageName }}/README.md
      - src: tools/{{ .PackageName }}.service
        dst: /usr/lib/systemd/system/{{ .PackageName }}.service
      - dst: /etc/{{ .ProjectName }}
        type: dir
      - src: examples/config.yaml
        dst: /etc/{{ .ProjectName }}/config.yaml
        type: config|noreplace
      - src: io.github.heathcliff26.{{ .PackageName }}.metainfo.xml
        dst: /usr/share/metainfo/io.github.heathcliff26.{{ .PackageName }}.metainfo.xml
    scripts:
      postinstall: "tools/postinstall.sh"
      preremove: "tools/preremove.sh"
      postremove: "tools/postremove.sh"
    rpm:
      summary: Wake on Lan Utility

changelog:
  disable: true
release:
  disable: true
